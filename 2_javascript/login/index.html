<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="w500 banner">
        <p>Register Page</p>
    </div>
    <div class="w500 register_panel">
        <div class="w400 input mgn_tp40">
            <span>User Name:&nbsp;</span>
            <input type="text" id="username">
        </div>
        <div class="w400 check">
            <span id="namecheck"></span>
        </div>
        <div class="w400 input">
            <span>Password:&nbsp;</span>
            <input type="password" id="password">
            <img src="img/eye-close.svg" alt="" id="pwd_icon">
        </div>
        <div class="w400 check">
            <span id="pwdcompliance"></span>
        </div>
        <div class="w400 input">
            <span>Pwd Again:&nbsp;</span>
            <input type="password" id="re-password">
            <img src="img/eye-close.svg" alt="" id="pwd_check_icon">
        </div>
        <div class="w400 check">
            <span id="pwdcheck"></span>
        </div>
        <div class="split"></div>
        <div class="w400" id="register_btn">Register</div>
        <div class="w400 check">
            <span id="regresult"></span>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
