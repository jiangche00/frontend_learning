<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text">
    <script>
        /*
        正则表达式
            写在双斜线之中
            / 正则 /
            中括号里面选择比选字符，每个中括号只能匹配1个字符
            数量词 {num} 代表前面一位重复多少次
                  {num,} 前面一位至少重复几次
                  {min,max} 前面一位至少重复min次至多重复max次
            连续的区间用 - 连接
            与定义字符集
            \d: 代表任意1位数字
            \w: 代表任意1位数字或字母或下划线
            \W: 代表非数字非字母非下划线 (即特殊符号)
            .: 代表任意字符
            \s: 代表空格
            \d: 所有数字
            \D: 所有的非数字


            如果备选字符集中只有一个备选字符或者预定义字符，则可以省略中括号

            正则表达式.test(字符串) 对字符串判断正则，返回bool值，正确true，错误false
            默认是部分匹配
            在正则表达式最前面添加^ 以什么什么为开头
            在正则表达所最后面添加$ 以什么什么结尾


            特殊数量词
            ?: 前面1位规则可有可无，最多出现1次，{0.1}
            *: {0,}
            +: {1,}

            在备选字符的前面加^, 代表除了什么什么都行
            加 \ 转义
        */
        var reg = /^[1][3-9]\d{9}$/ //手机号正则

        var reg2 = /^w+@\w+([-]\w+)*(\.[\Da-zA-Z]+)+$/;  //匹配邮箱
    </script>
</body>
</html>
