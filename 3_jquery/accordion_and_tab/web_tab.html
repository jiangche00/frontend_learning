<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web tab</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #titles{overflow: hidden;}
        .tag{
            width: 80px;
            height: 50px;
            background-color: gray;
            float: left;
            text-align: center;
            line-height: 50px;
            margin-right: 5px;
            color: #fff;
        }
        .content{
            width: 335px;
            height: 300px;
            background-color: pink;
            display: none;
        }
        .act{display: block;}
    </style>
    <script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
</head>
<body>
    <div id="titles">
        <div class="tag">体育新闻</div>
        <div class="tag">科技新闻</div>
        <div class="tag">电影新闻</div>
        <div class="tag">娱乐新闻</div>
    </div>
    <div id="contents">
        <div class="content act">
            <p>体育1</p>
            <p>体育2</p>
            <p>体育3</p>
            <p>体育4</p>
        </div>
        <div class="content">
            <p>科技1</p>
            <p>科技2</p>
            <p>科技3</p>
            <p>科技4</p>
        </div>
        <div class="content">
            <p>电影1</p>
            <p>电影2</p>
            <p>电影3</p>
            <p>电影4</p>
        </div>
        <div class="content">
            <p>娱乐1</p>
            <p>娱乐2</p>
            <p>娱乐3</p>
            <p>娱乐4</p>
        </div>
    </div>

    <script>
        $("#titles .tag").on("click", function(){
            // 获取index
            const idx = $(this).index();
            // 设置this的颜色为红色，其他的颜色为灰色
            $(this).css({background: "red"});
            $(this).siblings("div").css({background: "gray"});
            // 找到上一次拥有act类的元素，将act标签删掉
            $(this).parent().next().children(".act").removeClass("act");
            // 根据index，给相应的元素添加上act标签
            $(this).parent().next().children().eq(idx).addClass("act");
        })
    </script>
</body>
</html>
