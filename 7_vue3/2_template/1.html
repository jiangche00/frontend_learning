<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app"></div>
    <script>
        const { createApp } = Vue;
        createApp({
            // 组件的数据都定义在data()里面
            template: `<h1>{{ num }}</h1>`,
            data() {
                return {
                    num: 100,
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
