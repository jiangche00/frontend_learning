<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verify</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- logo -->
    <div class="w380 logo">
        <img src="img/logo.png" alt="">
    </div>

    <!-- verification panel -->
    <div class="w380 verify_panel">
        <div class="w300 verify_input">
            <div class="cellphone input_box">
                <p class="prompt">您的手机号</p>
            </div>
            <div class="signup_btn">立即注册</div>
            <div class="aggrement mgn_tp12">
                <p class="aggrement_prompt fr">注册视为同意<span class="dark">《悠游用户使用协议》</span></p>
            </div>
        </div>
        <div class="split"></div>
        <div class="w300 sso">
            <p class="sso_prompt">用合作网站账户直接登陆</p>
            <div class="provider_wrap">
                <div class="provider fl">
                    <div class="img">
                        <img src="img/weibo.png" alt="">
                    </div>
                    <p>新浪微博</p>
                </div>
                <div class="provider fl">
                    <div class="img">
                        <img src="img/QQ.png" alt="">
                    </div>
                    <p>QQ</p>
                </div>
                <div class="provider fl">
                    <div class="img">
                        <img src="img/wechat.png" alt="">
                    </div>
                    <p>微信</p>
                </div>
            </div>
        </div>
    </div>

    <!-- login -->
    <div class="w380 login">
        <p>已有账号？<span class="blue">马上登陆</span></p>
    </div>
</body>
</html>
