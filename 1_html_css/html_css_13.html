<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        .fl{float: left;}
        .fr{float: right;}
        .clear{clear: both;}
        .head{width: 1200px; margin: auto; font-size: 18px; color: #3c3d46;}
        .logo{margin-top: 7px;}
        .logo img{vertical-align: middle;}
        li{list-style: none;}
        .nav li{
            float: left; 
            width: 80px; 
            height: 72px; 
            margin-right: 24px;
            text-align: center;
            line-height: 72px;
        }
        .nav{margin-left: 159px;}
        .act{background-color: #5696ff; color: #fff !important;}
        .login{line-height: 72px;}
        .line{margin: 0 10px;}



        .banner{
            height: 48px;
            background: url(youyou-main-adv.jpg) no-repeat center;
            padding-top: 552px;
        }
        .change{width: 53px; margin: auto;}
        .cir{width: 16px; height: 16px; border-radius: 50%;}
        .circle1{background-color: #fff;}
        /* box-sizing: border-box 把描边算在宽高里面 */
        .circle2{border: #fff 2px solid; box-sizing: border-box;}


        .title .line{width: 78px; height: 6px; background-color: #666666; margin-top: 18px;}
        .area{width: 327px; margin: auto; margin-top: 60px;}
        .title h1{margin-left: 2px; font-size: 32px; color: #5696ff;}
        .second_title{text-align: center; font-size: 22px; color: #666666; margin-top: 24px;}


        .search{
            width: 350px; 
            margin: auto; 
            position: relative; 
            margin-top: 70px;
        }
        .search input{
            width: 350px;
            height: 40px;
            border: #666666 1px solid;
            border-radius: 5px;
        }
        .search img{position: absolute; right: 13px; top: 8px;}



        .areapic_list{
            width: 1202px;
            margin: auto;
            margin-top: 55px;
        }
        .pic{
            width: 118px;
            height: 373px;
            float: left;
            margin-right: 3px;
        }
        .denmark{
            width: 596px;
            background: url(youyou-denmark-pic.jpg);
        }
        .sichuan{
            background: url(youyou-sichuan-pic.jpg) no-repeat center;
        }
        .dali{
            background: url(youyou-dali-pic.jpg) no-repeat center;
        }
        .japan{
            background: url(youyou-japan-pic.jpg) no-repeat center;
        }
        .italy{
            background: url(youyou-italy-pic.jpg) no-repeat center;
        }
        .france{
            background: url(youyou-france-pic.jpg) no-repeat center;
            margin-right: 0px;
        }
        .shadow{
            height: 303px; background-color: rgba(51, 51, 51, 0.5);
            padding-left: 31px; padding-top: 70px;
        }
        .shadow p{
            font-size: 28px; color: #fbfcfd;
            line-height: 30px;
        }



        .more{
            width: 160px; 
            height: 54px; 
            border: #5696ff 2px solid;
            border-radius: 5px;
            font-size: 26px;
            color: #5696ff;
            background: none;
            margin: auto;
            line-height: 54px;
            text-align: center;
            margin-top: 72px;
        }
    </style>
</head>
<body>
    <div class="wrap"></div>
    <!-- 头部导航 -->
    <div class="head">
        <div class="logo fl">
            <img src="youyou-logo-icon.png" alt="">
            <img src="youyou-logo-text.png" alt="">
        </div>
        <ul class="nav fl">
            <li class="act">首页</li>
            <li>地区</li>
            <li>特惠</li>
            <li>资讯</li>
            <li>游记</li>
            <div class="clear"></div>
        </ul>
        <div class="fr login">
            <span>登陆</span><span class="line">|</span><span>注册</span>
        </div>
        <div class="clear"></div>
    </div>
    <!-- banner图 -->
    <div class="banner">
        <div class="change">
            <div class="circle1 cir fl"></div>
            <div class="circle2 cir fr"></div>
            <div class="clear"></div>
        </div>
    </div>
    <!-- 搜索框 -->
    <div class="search">
        <input type="text">
        <img src="youyou-search-icon.png" alt="">
    </div>
    <!-- 地区旅游 -->
    <div class="area">
        <div class="title">
            <div class="line fl"></div>
            <h1 class="fl">地区旅游</h1>
            <div class="line fr"></div>
            <div class="clear"></div>
        </div>
        <div class="second_title">
            从这开始有意思的地区文化
        </div>
    </div>
    <!-- 图片列表 -->
    <div class="areapic_list">
        <div class="pic sichuan">
            <div class="shadow">
                <p>四<br>川</p>
            </div>
        </div>
        <div class="pic dali">
            <div class="shadow">
                <p>大<br>理</p>
            </div>
        </div>
        <div class="pic denmark">
            <div class="shadow">
                <p>丹<br>麦</p>
            </div>
        </div>
        <div class="pic japan">
            <div class="shadow">
                <p>日<br>本</p>
            </div>
        </div>
        <div class="pic italy">
            <div class="shadow">
                <p>意<br>大<br>利</p>
            </div>
        </div>
        <div class="pic france">
            <div class="shadow">
                <p>法<br>国</p>
            </div>
        </div>
        <div class="clear"></div>
    </div>
    <!-- more按钮 -->
    <div class="more">
        More>
    </div>
</html>
