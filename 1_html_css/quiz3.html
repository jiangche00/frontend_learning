<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .clear{clear: both;}
        /* head section */
        .head{
            width: 600px;
            height: 100px;
            background-color: gray;
            margin-bottom: 10px;
        }
        .title{
            width: 100px;
            height: 60px;
            margin-top: 20px;
            margin-left: 20px;
            float: left;
            background-color: yellow;
        }
        .title_txt{
            width: 60px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            margin: 5px 5px;
            float: left;
            background-color: orchid;
        }
        .arrow{
            width: 15px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            margin: 5px 5px;
            float: right;
            background-color: orchid;
        }
        .nav{
            width: 400px;
            height: 60px;
            margin: 20px 20px;
            float: right;
            background-color: yellow;
        }
        .item{
            width: 50px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            margin: 10px 15px;
            background-color: orchid;
            float: left;
        }


        /* product section */
        .product{
            width: 600px;
            height: 400px;
            background-color: gray;
        }
        .main_product{
            width: 150px;
            height: 380px;
            background-color: yellow;
            margin: 10px 10px 10px;
            float: left;
        }
        .main_pic{
            width: 130px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            background-color: orchid;
            margin: 10px;
        }
        .main_info{
            width: 130px;
            height: 80px;
            line-height: 80px;
            text-align: center;
            background-color: orchid;
            margin: 10px;
        }
        .main_price{
            width: 130px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: orchid;
            margin: 10px;
        }
        .product_list{
            width: 400px;
            height: 380px;
            background-color: yellow;
            margin: 10px 10px 10px;
            float: right;
        }
        .product_group{
            width: 380px;
            height: 160px;
            background-color: orchid;
            margin: 20px 10px;
        }
        .product_object{
            width: 180px;
            height: 140px;
            background-color: green;
            margin: 10px 5px;
            float: left;
        }
        .product_pic{
            width: 100px;
            height: 120px;
            line-height: 120px;
            text-align: center;
            background-color: white;
            margin: 10px 5px;
            float: left;
        }
        .product_info{
            width: 60px;
            height: 120px;
            background-color: white;
            margin: 10px 5px;
            float: right;
        }
        .product_description{
            width: 50px;
            height: 80px;
            line-height: 80px;
            text-align: center;
            color: white;
            background-color: red;
            margin: 5px 5px;
        }
        .product_price{
            width: 50px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            color: white;
            background-color: red;
            margin: 10px 5px;
        }
    </style>
</head>
<body>
    <div class="head">
        <div class="title">
            <div class="title_txt">
                title_text
            </div>
            <div class="arrow">
                >
            </div>
            <div class="clear"></div>
        </div>
        <div class="nav">
            <div class="item">item1</div>
            <div class="item">item2</div>
            <div class="item">item3</div>
            <div class="item">item4</div>
            <div class="item">item5</div>
            <div class="clear"></div>
        </div>
        <div class="clear"></div>
    </div>
    <div class="product">
        <div class="main_product">
            <div class="main_pic">main_pic</div>
            <div class="main_info">main_info</div>
            <div class="main_price">main_price</div>
        </div>
        <div class="product_list">
            <div class="product_group">
                <div class="product_object">
                    <div class="product_pic">pic1</div>
                    <div class="product_info">
                        <div class="product_description">No.1</div>
                        <div class="product_price">$1</div>
                    </div>
                    <div class="clear"></div>
                </div>
                <div class="product_object">
                    <div class="product_pic">pic2</div>
                    <div class="product_info">
                        <div class="product_description">No.2</div>
                        <div class="product_price">$2</div>
                    </div>
                    <div class="clear"></div>
                </div>
                <div class="clear"></div>
            </div>
            <div class="product_group">
                <div class="product_object">
                    <div class="product_pic">pic3</div>
                    <div class="product_info">
                        <div class="product_description">No.3</div>
                        <div class="product_price">$3</div>
                    </div>
                    <div class="clear"></div>
                </div>
                <div class="product_object">
                    <div class="product_pic">pic4</div>
                    <div class="product_info">
                        <div class="product_description">No.4</div>
                        <div class="product_price">$4</div>
                    </div>
                    <div class="clear"></div>
                </div>
                <div class="clear"></div>
            </div>
        </div>
        <div class="clear"></div>
    </div>
</body>
</html>
