<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        输入框标签 (表单标签)
        本质上是内联元素， 但是可以设置宽高，类似内联块

        type: 
            text 文本输入框
            password 密码输入框
        
        placeholder:
             占位符
    -->

    <!-- 
        半透明效果
        1. 属性opacity 设置0到1之间。0为全透明，1为不透明
        2. 使用rgba颜色，是四元组，前三位是rgb，最后1位是透明度，也是0到1之间

        注意，使用opacity的时候会同时改变子集的透明度。
        而使用rgba颜色，只会改变自己，不会影响子集
      -->

    <!-- 换行标签，<br> -->
     <!-- 按钮标签 button -->
    <input type="text" placeholder="please input">
    <button class="">More</button>
</body>
</html>
