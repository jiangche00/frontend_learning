<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- logo -->
    <div class="w380 logo">
        <img src="img/logo.png" alt="">
    </div>

    <!-- sign-in panel -->
    <div class="w380 login_panel">
        <div class="w300 login_input">
            <div class="mail_cellphone input_box">
                <p class="prompt">您的邮箱/手机号</p>
            </div>
            <div class="password input_box mgn_tp18">
                <p class="prompt">您的密码</p>
            </div>
            <div class="forgot_password mgn_tp12">
                <p class="forgot_prompt fr">忘记密码</p>
            </div>
            <div class="login_btn">登录</div>
        </div>
        <div class="split"></div>
        <div class="w300 sso">
            <p class="sso_prompt">用合作网站账户直接登陆</p>
            <div class="provider_wrap">
                <div class="provider fl">
                    <div class="img">
                        <img src="img/weibo.png" alt="">
                    </div>
                    <p>新浪微博</p>
                </div>
                <div class="provider fl">
                    <div class="img">
                        <img src="img/QQ.png" alt="">
                    </div>
                    <p>QQ</p>
                </div>
                <div class="provider fl">
                    <div class="img">
                        <img src="img/wechat.png" alt="">
                    </div>
                    <p>微信</p>
                </div>
            </div>
        </div>
    </div>

    <!-- sign-up -->
    <div class="w380 sign_up">
        <p>还没有账号？<span class="blue">马上注册</span></p>
    </div>
</body>
</html>
