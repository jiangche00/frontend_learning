<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .clear{clear: both;}
        .fl{float: left;}
        .fr{float: right;}
        .wrap{width: 1400px; padding: 20px; background-color: gray;}
        .logo,.search,.code{
            width: 200px; height: 200px; background-color: red;
        }
        .search{width: 650px; margin-left: 100px; padding: 25px; height: 150px;}
        .recommend{height: 80px; background-color: yellow; padding: 10px;}
        .nav{height: 40px; background-color: yellow; margin-top: 10px; padding: 5px;}
        .type,.cart{height: 50px; background-color: green;}
        .type{width: 380px; padding: 10px; height: 30px;}
        .cart{width: 150px;}
        .nav .item{width: 50px; height: 40px; background-color: green; float: left; margin-left: 13px;}
        .input,.hotwords{height: 15px; background-color: purple;}
        .input{margin-bottom: 4px;}
        .hotwords .item{float: left; width: 30px; height: 10px; margin-top: 3px; margin-left: 11px; background-color: pink;}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo fl"></div>
        <div class="search fl">
            <div class="recommend">
                <div class="type fl">
                    <div class="input"></div>
                    <div class="hotwords">
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="item"></div>
                        <div class="clear"></div>
                    </div>
                </div>
                <div class="cart fr"></div>
                <div class="clear"></div>
            </div>
            <div class="nav">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="clear"></div>
            </div>
        </div>
        <div class="code fr"></div>
        <div class="clear"></div>
    </div>
</body>
</html>
