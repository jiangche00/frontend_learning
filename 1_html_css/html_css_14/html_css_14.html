<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        .fl{float: left;}
        .fr{float: right;}
        .clear{clear: both;}
        .head{width: 1200px; margin: auto; font-size: 18px; color: #3c3d46;}
        .logo{margin-top: 7px;}
        .logo img{vertical-align: middle;}
        li{list-style: none;}
        .nav li{
            float: left; 
            width: 80px; 
            height: 72px; 
            margin-right: 24px;
            text-align: center;
            line-height: 72px;
        }
        .nav{margin-left: 159px;}
        .act{background-color: #5696ff; color: #fff !important;}
        .login{line-height: 72px;}
        .line{margin: 0 10px;}



        .banner{
            height: 48px;
            background: url(youyou-main-adv.jpg) no-repeat center;
            padding-top: 552px;
        }
        .change{width: 53px; margin: auto;}
        .cir{width: 16px; height: 16px; border-radius: 50%;}
        .circle1{background-color: #fff;}
        /* box-sizing: border-box 把描边算在宽高里面 */
        .circle2{border: #fff 2px solid; box-sizing: border-box;}


        .title .line{width: 78px; height: 6px; background-color: #666666; margin-top: 18px;}
        .area{width: 327px; margin: auto; margin-top: 60px;}
        .title h1{margin-left: 2px; font-size: 32px; color: #5696ff;}
        .second_title{text-align: center; font-size: 22px; color: #666666; margin-top: 24px;}


        .search{
            width: 350px; 
            margin: auto; 
            position: relative; 
            margin-top: 70px;
        }
        .search input{
            width: 350px;
            height: 40px;
            border: #666666 1px solid;
            border-radius: 5px;
        }
        .search img{position: absolute; right: 13px; top: 8px;}



        .areapic_list{
            width: 1202px;
            margin: auto;
            margin-top: 55px;
        }
        .pic{
            width: 118px;
            height: 373px;
            float: left;
            margin-right: 3px;
        }
        .denmark{
            width: 596px;
            background: url(youyou-denmark-pic.jpg);
        }
        .sichuan{
            background: url(youyou-sichuan-pic.jpg) no-repeat center;
        }
        .dali{
            background: url(youyou-dali-pic.jpg) no-repeat center;
        }
        .japan{
            background: url(youyou-japan-pic.jpg) no-repeat center;
        }
        .italy{
            background: url(youyou-italy-pic.jpg) no-repeat center;
        }
        .france{
            background: url(youyou-france-pic.jpg) no-repeat center;
            margin-right: 0px;
        }
        .shadow{
            height: 303px; background-color: rgba(51, 51, 51, 0.5);
            padding-left: 31px; padding-top: 70px;
        }
        .shadow p{
            font-size: 28px; color: #fbfcfd;
            line-height: 30px;
        }



        .more{
            width: 160px; 
            height: 54px; 
            border: #5696ff 2px solid;
            border-radius: 5px;
            font-size: 26px;
            color: #5696ff;
            background: none;
            margin: auto;
            line-height: 54px;
            text-align: center;
            margin-top: 72px;
        }


        .adv_blocks{
            width: 1200px;
            margin: auto;
            margin-top: 54px;
        }

        .up_part{
            margin-bottom: 8px;
        }

        .up_part .denmark_adv{
            width: 441px;
            height: 307px;
            background: url(youyou-denmark-5d6n.jpg) no-repeat center;
            margin-right: 8px;
            position: relative;
        }

        .up_part .vietnam_adv{
            width: 400px;
            height: 265px;
            background: url(youyou-vietnam-12d.jpg) no-repeat center;
            position: relative;
            padding: 21px;
        }

        .down_part .thailand_adv{
            width: 362px;
            height: 369px;
            background: url(youyou-thailand-5d.jpg) no-repeat center;
            margin-right: 8px;
            position: relative;
        }

        .down_part .malaysia_adv{
            width: 521px;
            height: 369px;
            background: url(youyou-malaysia-6d4n.jpg) no-repeat center;
            position: relative;
        }
        .blocks_right .japan_adv{
            width: 300px;
            height: 472px;
            background: url(youyou-japan-5d6n.jpg) no-repeat center;
            margin-bottom: 8px;
            position: relative;
        }
        .blocks_right .india_adv{
            width: 300px;
            height: 204px;
            background: url(youyou-india-4d.jpg) no-repeat center;
            position: relative;
        }
        .adv_blocks p{
            font-size: 22px;
            color: #fff;
            position: absolute;
            top: 49px;
            left: 56px;
        }
        .vietnam_adv .shadow{
            height: 266px; background-color: rgba(51, 51, 51, 0.5);
            border: #fff 4px solid;
            padding: 0;
            position: relative;
        }
        .price{
            position: absolute;
            top: 90px;
            left: 40px;
        }
        .price .line{width: 88px; height: 6px; background-color: #fff; margin-top: 18px;}
        .price h1{margin-left: 12px; margin-right: 12px; font-size: 32px; color: #fff;}


        .more2{
            width: 160px; 
            height: 54px;
            background-color: #5696ff;
            border: #5696ff 2px solid;
            border-radius: 5px;
            font-size: 26px;
            color: #fff;
            margin: auto;
            line-height: 54px;
            text-align: center;
            margin-top: 72px;
        }

        .second_title_lvyouzixun{font-size: 20px;}
    </style>
</head>
<body>
    <div class="wrap"></div>
    <!-- 头部导航 -->
    <div class="head">
        <div class="logo fl">
            <img src="youyou-logo-icon.png" alt="">
            <img src="youyou-logo-text.png" alt="">
        </div>
        <ul class="nav fl">
            <li class="act">首页</li>
            <li>地区</li>
            <li>特惠</li>
            <li>资讯</li>
            <li>游记</li>
            <div class="clear"></div>
        </ul>
        <div class="fr login">
            <span>登陆</span><span class="line">|</span><span>注册</span>
        </div>
        <div class="clear"></div>
    </div>
    <!-- banner图 -->
    <div class="banner">
        <div class="change">
            <div class="circle1 cir fl"></div>
            <div class="circle2 cir fr"></div>
            <div class="clear"></div>
        </div>
    </div>
    <!-- 搜索框 -->
    <div class="search">
        <input type="text">
        <img src="youyou-search-icon.png" alt="">
    </div>
    <!-- 地区旅游 -->
    <div class="area">
        <div class="title">
            <div class="line fl"></div>
            <h1 class="fl">地区旅游</h1>
            <div class="line fr"></div>
            <div class="clear"></div>
        </div>
        <div class="second_title">
            从这开始有意思的地区文化
        </div>
    </div>
    <!-- 图片列表 -->
    <div class="areapic_list">
        <div class="pic sichuan">
            <div class="shadow">
                <p>四<br>川</p>
            </div>
        </div>
        <div class="pic dali">
            <div class="shadow">
                <p>大<br>理</p>
            </div>
        </div>
        <div class="pic denmark">
            <div class="shadow">
                <p>丹<br>麦</p>
            </div>
        </div>
        <div class="pic japan">
            <div class="shadow">
                <p>日<br>本</p>
            </div>
        </div>
        <div class="pic italy">
            <div class="shadow">
                <p>意<br>大<br>利</p>
            </div>
        </div>
        <div class="pic france">
            <div class="shadow">
                <p>法<br>国</p>
            </div>
        </div>
        <div class="clear"></div>
    </div>
    <!-- more按钮 -->
    <div class="more">
        More>
    </div>
    <!-- 特惠行程 -->
    <div class="area">
        <div class="title">
            <div class="line fl"></div>
            <h1 class="fl">特惠行程</h1>
            <div class="line fr"></div>
            <div class="clear"></div>
        </div>
        <div class="second_title">
            给你带来最省钱的旅游
        </div>
    </div>
    <!-- 图片广告块 -->
    <div class="adv_blocks">
        <div class="blocks_left fl">
            <div class="up_part">
                <div class="denmark_adv fl">
                    <p>丹麦5晚6日童话之旅</p>
                </div>
                <div class="vietnam_adv fl">
                    <div class="shadow">
                        <div class="price">
                            <div class="line fl"></div>
                            <h1 class="fl">¥2300</h1>
                            <div class="line fr"></div>
                            <div class="clear"></div>
                        </div> 
                    </div>
                    <p>越南12晚3天美妙之旅</p>
                </div>
                <div class="clear"></div>
            </div>
            <div class="down_part">
                <div class="thailand_adv fl">
                    <p>泰国曼谷5晚6日游</p>
                </div>
                <div class="malaysia_adv fl">
                    <p>马来西亚4晚6日经典游</p>
                </div>
                <div class="clear"></div>
            </div>
        </div>
        <div class="blocks_right fr">
            <div class="japan_adv">
                <p>日本5晚6日全景游</p>
            </div>
            <div class="india_adv">
                <p>印度4晚6日经典游</p>
            </div>
        </div>
        <div class="clear"></div>
    </div>
    <!-- more按钮2 -->
    <div class="more2">
        More>
    </div>
    <!-- 旅游资讯 -->
    <div class="area">
        <div class="title">
            <div class="line fl"></div>
            <h1 class="fl">旅游资讯</h1>
            <div class="line fr"></div>
            <div class="clear"></div>
        </div>
        <div class="second_title second_title_lvyouzixun">
            各种奇妙有趣的新闻等你来发现哦
        </div>
    </div>
</html>
